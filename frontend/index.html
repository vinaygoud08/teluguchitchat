<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1440" />
    <title>Chit Chat Telugu - Fast, Secure & Fun Chat</title>
    <script>
      window.global = window;
      window.process = { env: { NODE_ENV: 'production' } };
    </script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0d0d12;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #app-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #1a1440 0%, #0d0d12 100%);
        text-align: center;
      }
      .splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(135deg, #5046e5 0%, #ff6b6b 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.2rem;
        box-shadow: 0 12px 32px rgba(80, 70, 229, 0.4);
        margin-bottom: 16px;
        animation: pulse 1.8s infinite ease-in-out;
      }
      .splash-title {
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #5046e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 18px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="splash-logo">💬</div>
        <div class="splash-title">Chit Chat Telugu</div>
        <div style="font-size: 0.85rem; color: #9494b0;">Loading secure chat...</div>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
